<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraShop | Premium E-Commerce Experience</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Shop the latest premium electronics, fashion, and lifestyle essentials at AuraShop.">
    
    <!-- External Assets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Application Styles -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <div id="app">
        <!-- Offline Status Banner -->
        <div id="offline-banner" style="display: none; background: var(--danger, #ff4d4f); color: white; text-align: center; padding: 10px; font-weight: bold; z-index: 1000; position: relative;">
            You are currently offline. Some features may be unavailable.
            <button id="retry-connection-btn" style="margin-left: 10px; padding: 4px 8px; background: white; color: var(--danger, #ff4d4f); border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Retry Connection</button>
        </div>
        <!-- Main Navigation -->
        <header>
            <div class="container nav-container">
                <a href="#home" class="logo">AuraShop</a>
                
                <div class="search-bar">
                    <input type="text" placeholder="Search products, brands, and more...">
                    <i class="fas fa-search" style="position: absolute; right: 1.2rem; top: 1rem; color: var(--text-muted);"></i>
                </div>
                
                <nav style="display: flex; gap: 2.5rem; align-items: center;">
                    <a href="#shop" class="footer-link" style="font-weight: 600;">Shop</a>
                    <a href="#cart" style="position: relative;">
                        <i class="fas fa-shopping-cart" style="font-size: 1.2rem;"></i>
                        <span id="cart-badge" style="position: absolute; top: -8px; right: -12px; background: var(--accent); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; font-weight: 800; display: none;">0</span>
                    </a>
                    <a href="#login"><i class="far fa-user" style="font-size: 1.2rem;"></i></a>
                    <a href="#settings" id="nav-settings" style="display: none;"><i class="fas fa-cog" style="font-size: 1.2rem;"></i></a>
                    <button id="hamburger" style="display: none;"><i class="fas fa-bars"></i></button>
                </nav>
            </div>
        </header>

        <!-- Dynamic Content Injection -->
        <main id="main-content">
            <!-- App.js will inject content here based on route -->
        </main>

        <!-- Global Footer -->
        <footer>
            <div class="container">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 3rem; margin-bottom: 4rem;">
                    <div>
                        <h3 style="margin-bottom: 1.5rem;">Shop</h3>
                        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.8rem;">
                            <li><a href="#shop" class="footer-link">All Products</a></li>
                            <li><a href="#shop?cat=electronics" class="footer-link">Electronics</a></li>
                            <li><a href="#shop?cat=fashion" class="footer-link">Fashion</a></li>
                        </ul>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 1.5rem;">Support</h3>
                        <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.8rem;">
                            <li><a href="#" class="footer-link">Help Center</a></li>
                            <li><a href="auth-explorer.html" target="_blank" style="color: var(--primary); font-weight: 700;">Auth Explorer</a></li>
                        </ul>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 1.5rem;">Newsletter</h3>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Get updates on new drops and sales.</p>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="email" placeholder="Email" style="background: var(--surface); border: 1px solid var(--border); padding: 0.8rem; border-radius: 8px; color: white; flex: 1;">
                            <button class="btn-primary">Join</button>
                        </div>
                    </div>
                </div>
                <div style="padding-top: 2rem; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                    &copy; 2026 AuraShop. Designed for excellence.
                </div>
            </div>
        </footer>
    </div>

    <!-- Application Script -->
    <script type="module" src="js/index.js"></script>
</body>
</html>
